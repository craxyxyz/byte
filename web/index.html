<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Byte - music by Apurba Laskar">
  <meta name="theme-color" content="#F7F7FA">
  <meta name="color-scheme" content="dark light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Byte">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://ymnmrxgbjgvtavzyohdp.supabase.co" crossorigin>
  <title>Byte</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F7F7FA; overscroll-behavior: none; }
    #byte-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; background: radial-gradient(120% 80% at 50% 20%, #ffe3ea 0%, #F7F7FA 60%); color: #111;
      font: 600 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: opacity .35s ease; z-index: 10; }
    #byte-splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 18px 50px rgba(240, 24, 72, .35); animation: byte-pulse 1.6s ease-in-out infinite; }
    #byte-splash .name { font-size: 26px; font-weight: 800; letter-spacing: .5px; }
    #byte-splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(0,0,0,.1); overflow: hidden; }
    #byte-splash .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, #F01848, #FF6B6B); border-radius: 3px; animation: byte-load 1.1s ease-in-out infinite; }
    #byte-splash .by { position: absolute; bottom: 28px; font-weight: 500; font-size: 12px; color: rgba(0,0,0,.45); }
    #byte-splash.done { opacity: 0; pointer-events: none; }
    @keyframes byte-pulse { 50% { transform: scale(1.04); } }
    @keyframes byte-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #byte-splash img, #byte-splash .bar i { animation: none; } }
  </style>
</head>
<body>
  <div id="byte-splash" aria-label="Byte is loading">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">Byte</div>
    <div class="bar"><i></i></div>
    <div class="by">© 2026 Apurba Laskar</div>
  </div>
  <noscript>Byte needs JavaScript turned on.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      window.__byteFirstFrame = performance.now();
      var s = document.getElementById('byte-splash');
      if (s) { s.classList.add('done'); setTimeout(function () { s.remove(); }, 400); }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () { navigator.serviceWorker.register('byte_sw.js').catch(function () {}); });
    }
  </script>
  <script src="embed.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
