# © 2026 Apurba Laskar
# Byte 2.0 for Windows: build from this branch on a Windows runner, check the app, zip it,
# prove what can be proven on the runner, and publish the result for the build owner.
name: Byte Windows build

on:
  push:
    branches: [v2-desktop]
    paths-ignore: ['.github/workflows/desktop-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: byte-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ !contains(github.event.head_commit.message, '[mac]') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Packages (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Build Windows (release)
        shell: bash
        run: |
          flutter build windows --release -v > build.log 2>&1 || { tail -c 9000 build.log; exit 1; }

      - name: On a build failure, publish the errors (ci-logs branch)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=${{ github.run_id }}
          {
            echo "run $RUN build errors:"
            grep -n -E 'error (C|LNK|MSB|PRJ)[0-9]+|: error|Build FAILED|build process failed|Build process failed|ToolExit|Error: |Exception:' build.log | grep -v 'Structured output' | cut -c1-300 | head -n 25
            echo '--- before the stack'
            grep -n -B14 -m1 'build_windows.dart' build.log | cut -c1-300 | head -c 2000
            echo; echo '--- tail'
            tail -c 1200 build.log
          } > errs.txt || true
          head -c 5800 errs.txt > errs2.txt
          B=$(base64 -w0 errs2.txt)
          gh api -X PUT "repos/${{ github.repository }}/contents/ci/win-build-$RUN.txt" -f message="build errors $RUN" -f content="$B" -f branch=ci-logs || echo "push failed"

      - name: Verify, zip, check forbidden names
        shell: pwsh
        run: |
          ./.github/scripts/windows-verify.ps1 -Release build/windows/x64/runner/Release -Out out

      - name: Launch the app (window title, screenshot)
        shell: pwsh
        timeout-minutes: 6
        run: |
          ./.github/scripts/windows-smoke.ps1 -Stage out/Byte -Out out/smoke

      - name: Audio playback evidence (WinRT player, same engine as the app)
        shell: powershell
        timeout-minutes: 6
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\windows-audio-probe.ps1" -Out "$env:GITHUB_WORKSPACE\out\audio"

      - name: Publish the results (run notices, ci-logs branch, encrypted temp host)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=${{ github.run_id }}
          PASS=$(openssl rand -hex 24)
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass pass:$PASS -in out/Byte-2.0.0-windows-x64.zip -out out/byte-win.enc
          up() { BIN="byte-$RUN-$(openssl rand -hex 4)"; N=$(basename "$1"); curl -s -m 900 -X POST --data-binary @"$1" -H 'Content-Type: application/octet-stream' "https://filebin.net/$BIN/$N" > /dev/null && echo "https://filebin.net/$BIN/$N" || echo failed; }
          ZIPURL=$(up out/byte-win.enc)
          SHOT="none"
          if [ -f out/smoke/screen.png ]; then SHOT=$(up out/smoke/screen.png); fi
          SHA=$(sha256sum out/Byte-2.0.0-windows-x64.zip | cut -d' ' -f1)
          SIZE=$(stat -c %s out/Byte-2.0.0-windows-x64.zip)
          {
            echo "run $RUN zip sha256 $SHA bytes $SIZE"
            echo "zip-enc $ZIPURL"
            echo "pass $PASS"
            echo "shot $SHOT"
            cat out/verify.txt 2>/dev/null | head -c 1000
            echo "--- smoke"; cat out/smoke/smoke.txt 2>/dev/null | head -c 800
            echo "--- audio"; cat out/audio/audio.txt 2>/dev/null | head -c 1600
          } > report.txt
          # 1) run notices (readable through the API): packed into a few long lines
          python3 - <<'PY'
          import re
          lines = [l.rstrip() for l in open('report.txt', encoding='utf-8', errors='replace') if l.strip()]
          chunks, cur = [], ''
          for l in lines:
              if len(cur) + len(l) + 3 > 1500:
                  chunks.append(cur); cur = ''
              cur = (cur + ' | ' + l) if cur else l
          if cur: chunks.append(cur)
          for c in chunks[:10]:
              print('::notice title=byte-win::' + c.replace('%', '%25').replace('\r', ''))
          PY
          # 2) the ci-logs branch
          B=$(base64 -w0 report.txt)
          gh api -X PUT "repos/${{ github.repository }}/contents/ci/win-$RUN.txt" -f message="windows report $RUN" -f content="$B" -f branch=ci-logs > pushout.txt 2>&1 && echo "ci-logs ok" || echo "ci-logs push failed"

      - name: Keep the Windows zip and report on the run
        uses: actions/upload-artifact@v4
        with:
          name: Byte-Windows-2.0.0
          path: |
            out/Byte-2.0.0-windows-x64.zip
            out/smoke/screen.png
          if-no-files-found: error
          retention-days: 14

  macos:
    if: ${{ contains(github.event.head_commit.message, '[mac]') || contains(github.event.head_commit.message, '[both]') }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode on the runner (connectivity_plus needs the newest SDK)
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Packages (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Build macOS (release)
        run: |
          flutter build macos --release -v > build.log 2>&1 || { tail -c 9000 build.log; exit 1; }

      - name: On a macOS build failure, publish the errors
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=${{ github.run_id }}
          { echo "macos run $RUN build errors"; grep -n -E ': error:|\*\* BUILD FAILED|Build failed|error: |CocoaPods could not|pod install|Unable to|No such module|not found' build.log | grep -v -E 'Structured|warning:|Explicit dependency' | cut -c1-260 | head -n 14; echo '--- tail'; tail -c 900 build.log; } > errs.txt || true
          python3 - <<'PY'
          lines = [l.rstrip() for l in open('errs.txt', encoding='utf-8', errors='replace') if l.strip()]
          chunks, cur = [], ''
          for l in lines:
              if len(cur) + len(l) + 3 > 1500:
                  chunks.append(cur); cur = ''
              cur = (cur + ' | ' + l) if cur else l
          if cur: chunks.append(cur)
          for c in chunks[:10]:
              print('::notice title=byte-mac-err::' + c.replace('%', '%25'))
          PY

      - name: Check, zip, forbidden names
        shell: bash
        run: |
          set -u
          APP=build/macos/Build/Products/Release/Byte.app
          mkdir -p out
          { echo "CFBundleName=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' $APP/Contents/Info.plist)"
            echo "CFBundleShortVersionString=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $APP/Contents/Info.plist)"
            echo "CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' $APP/Contents/Info.plist)"
            echo "arch: $(lipo -info $APP/Contents/MacOS/Byte)"
            echo "copyright: $(/usr/libexec/PlistBuddy -c 'Print :NSHumanReadableCopyright' $APP/Contents/Info.plist)"
          } > out/verify.txt
          HITS=$(grep -ril -E 'bitchord|mochy' $APP 2>/dev/null | wc -l | tr -d ' ')
          echo "forbidden-name hits: $HITS" >> out/verify.txt
          [ "$HITS" = "0" ]
          ditto -c -k --sequesterRsrc --keepParent $APP out/Byte-2.0.0-macos.zip
          echo "zip bytes $(stat -f %z out/Byte-2.0.0-macos.zip) sha256 $(shasum -a 256 out/Byte-2.0.0-macos.zip | cut -d' ' -f1)" >> out/verify.txt
          unzip -l out/Byte-2.0.0-macos.zip | tail -1 >> out/verify.txt

      - name: Launch and audio evidence (macOS)
        shell: bash
        run: |
          set -u
          mkdir -p out/audio
          { echo "--- audio devices"; system_profiler SPAudioDataType 2>&1 | grep -E 'Output|Default|Transport|:$' | head -20; } > out/audio/audio.txt
          say -o out/audio/tone.aiff "Byte sound check" 2>/dev/null || true
          if [ -f out/audio/tone.aiff ]; then
            start=$(date +%s); afplay out/audio/tone.aiff; rc=$?
            echo "afplay exit $rc after $(( $(date +%s) - start )) s (system speech through the default output)" >> out/audio/audio.txt
          else
            echo "no speech tone could be made" >> out/audio/audio.txt
          fi
          open -n build/macos/Build/Products/Release/Byte.app || true
          sleep 25
          if pgrep -x Byte >/dev/null; then echo "Byte is running after 25 s" >> out/audio/audio.txt; else echo "Byte is not running" >> out/audio/audio.txt; fi
          pkill -x Byte || true

      - name: Publish the results (run notices, ci-logs branch, encrypted temp host)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=${{ github.run_id }}
          PASS=$(openssl rand -hex 24)
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass pass:$PASS -in out/Byte-2.0.0-macos.zip -out out/byte-mac.enc
          up() { BIN="byte-$RUN-$(openssl rand -hex 4)"; N=$(basename "$1"); curl -s -m 900 -X POST --data-binary @"$1" -H 'Content-Type: application/octet-stream' "https://filebin.net/$BIN/$N" > /dev/null && echo "https://filebin.net/$BIN/$N" || echo failed; }
          ZIPURL=$(up out/byte-mac.enc)
          { echo "macos run $RUN"; echo "zip-enc $ZIPURL"; echo "pass $PASS"; cat out/verify.txt | head -c 900; echo "--- audio"; cat out/audio/audio.txt | head -c 1200; } > report.txt
          python3 - <<'PY'
          lines = [l.rstrip() for l in open('report.txt', encoding='utf-8', errors='replace') if l.strip()]
          chunks, cur = [], ''
          for l in lines:
              if len(cur) + len(l) + 3 > 1500:
                  chunks.append(cur); cur = ''
              cur = (cur + ' | ' + l) if cur else l
          if cur: chunks.append(cur)
          for c in chunks[:10]:
              print('::notice title=byte-mac::' + c.replace('%', '%25'))
          PY
          B=$(base64 -i report.txt | tr -d '\n')
          gh api -X PUT "repos/${{ github.repository }}/contents/ci/mac-$RUN.txt" -f message="macos report $RUN" -f content="$B" -f branch=ci-logs > pushout.txt 2>&1 && echo "ci-logs ok" || echo "ci-logs push failed"

      - uses: actions/upload-artifact@v4
        with:
          name: Byte-macOS-2.0.0
          path: out/Byte-2.0.0-macos.zip
          if-no-files-found: error
          retention-days: 14
