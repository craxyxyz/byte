# © 2026 Apurba Laskar
# Byte desktop builds: Windows (.zip + installer), macOS (.app zip + .dmg),
# Linux (.tar.gz + AppImage) and an unsigned iPhone .ipa, all from this repo.
# Every push to main builds them; a run on main also refreshes the GitHub Release.
name: Byte desktop builds

on:
  push:
    branches: [main]
    paths-ignore: ['.github/**', 'README.md', 'installer/**', 'test_shots/**', 'test_live/**']
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the GitHub Release v<version> (otherwise a pre-release called pipeline-test)"
        type: boolean
        default: false
      only:
        description: "Platforms to build: all, or any of windows linux apple"
        type: string
        default: all
      tag:
        description: "Release tag instead of v<version> (e.g. v1.4.5-pc1); file names get the same suffix"
        type: string
        default: ''
      mac_runner:
        description: "Runner for the macOS + iPhone job (macos-latest is arm64; Intel when arm64 runners are short)"
        type: string
        default: macos-15-intel

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.8

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ !inputs.only || inputs.only == 'all' || contains(inputs.only, 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Version from pubspec
        shell: bash
        run: |
          echo "BYTE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - name: Build Windows
        shell: bash
        run: |
          flutter build windows --release -v > build.log 2>&1 || { tail -c 9000 build.log; exit 1; }
      - name: Why the build failed
        if: failure()
        shell: bash
        run: |
          grep -iE 'error|fatal|failed' build.log | grep -v 'Werror' | tail -n 40 > why.txt || true
          tail -n 60 build.log >> why.txt
          python - <<'EOF'
          t=open('why.txt',encoding='utf-8',errors='replace').read()[-7000:]
          for i in range(0,len(t),2300):
              print('::error title=build log %d::'%(i//2300)+t[i:i+2300].replace('%','%25').replace('\r','').replace('\n','%0A'))
          EOF
      - name: Check the exe
        shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Release/Byte.exe"
          if (!(Test-Path $exe)) { throw "Byte.exe missing" }
          $v = (Get-Item $exe).VersionInfo
          $v | Format-List ProductName, ProductVersion, FileVersion, CompanyName, LegalCopyright
          if ($v.ProductName -ne "Byte") { throw "ProductName is $($v.ProductName)" }
          Get-ChildItem build/windows/x64/runner/Release
      # 1.4.5.1: the Windows player must make sound with every Audio Lab
      # option saved on (1.4.5 played silently). A virtual speaker + loopback
      # recording on the runner, the real libmpv-2.dll from this build.
      - uses: LABSN/sound-ci-helpers@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sound check (virtual speaker, loopback recording)
        shell: bash
        run: |
          pip install -q soundcard numpy
          export PATH="$PWD/build/windows/x64/runner/Release:$PATH"
          BYTE_LEVEL_CMD="python .github/scripts/loopback_level.py" flutter test test_live/v1451_pc_sound_live_test.dart -r expanded > sound.log 2>&1 || true
          grep -a "\[sound\]\|+[0-9]*.*:\|Expected\|Actual\|silent" sound.log | tail -n 30 || true
          python - <<'EOF'
          t=open('sound.log',encoding='utf-8',errors='replace').read()
          lines=[l for l in t.splitlines() if '[sound]' in l or 'All tests passed' in l or 'Some tests failed' in l or 'Expected' in l or 'Actual' in l]
          msg='\n'.join(lines)[-3500:] or t[-3500:]
          print('::notice title=sound check::'+msg.replace('%','%25').replace('\r','').replace('\n','%0A'))
          EOF
          grep -q "All tests passed" sound.log
      # 1.4.5.2: smoothness gate (1.4.5-pc1 lagged and ran hot on a laptop):
      # the real Byte.exe plays a song with lyrics and a cover; a paused screen
      # must draw (almost) nothing, the open player must not redraw at the
      # screen's full refresh rate. Frames + the app's CPU, per screen.
      - name: Smoothness check (frames and CPU, playing and paused)
        shell: bash
        run: |
          pip install -q psutil
          python .github/scripts/perf_check.py build/windows/x64/runner/Release/Byte.exe
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release dist/Byte
          Compress-Archive -Path dist/Byte -DestinationPath "dist/Byte-v$env:BYTE_VERSION-windows.zip"
          Remove-Item -Recurse dist/Byte
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/byte.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: Byte-windows
          path: dist/*
          if-no-files-found: error

  linux:
    if: ${{ !inputs.only || inputs.only == 'all' || contains(inputs.only, 'linux') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Version from pubspec
        shell: bash
        run: |
          echo "BYTE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"
      - name: Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev libsecret-1-dev libjsoncpp-dev libmpv2 file
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos
      - name: Build Linux
        run: |
          flutter build linux --release -v > build.log 2>&1 || { tail -c 9000 build.log; exit 1; }
      - name: Check and pack
        run: |
          B=build/linux/x64/release/bundle
          file $B/byte
          file $B/byte | grep -q ELF
          mkdir -p dist && cp -r $B dist/Byte
          tar -C dist -czf dist/Byte-v$BYTE_VERSION-linux-x64.tar.gz Byte
          rm -rf dist/Byte
          ls -la dist
      - name: AppImage
        continue-on-error: true
        run: |
          B=build/linux/x64/release/bundle
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          cp -r $B/* AppDir/usr/bin/
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps && cp linux/byte.png AppDir/usr/share/icons/hicolor/512x512/apps/byte.png
          export LD_LIBRARY_PATH=$PWD/AppDir/usr/bin/lib
          ARGS=""
          for so in AppDir/usr/bin/lib/*.so; do ARGS="$ARGS --library $so"; done
          MPV=$(ldconfig -p | grep -o '/[^ ]*libmpv.so.2' | head -1)
          [ -n "$MPV" ] && ARGS="$ARGS --library $MPV"
          APPIMAGE_EXTRACT_AND_RUN=1 OUTPUT=dist/Byte-v$BYTE_VERSION-x86_64.AppImage ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/byte --desktop-file linux/byte.desktop --icon-file linux/byte.png $ARGS --output appimage
          ls -la dist
      - name: Why the build failed
        if: failure()
        run: |
          touch build.log
          grep -E 'error:' build.log | grep -v 'error: (Build|Emitting)' | sort -u | tail -n 25 > why.txt || true
          grep -iE 'error|fatal|failed' build.log | tail -n 20 >> why.txt || true
          tail -n 60 build.log >> why.txt
          python3 - <<'EOF'
          t=open('why.txt',encoding='utf-8',errors='replace').read()[-7000:]
          for i in range(0,len(t),2300):
              print('::error title=build log %d::'%(i//2300)+t[i:i+2300].replace('%','%25').replace('\r','').replace('\n','%0A'))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Byte-linux
          path: dist/*
          if-no-files-found: error

  apple:
    if: ${{ !inputs.only || inputs.only == 'all' || contains(inputs.only, 'apple') }}
    # macOS arm64 runners were short (jobs not picked up for 15 min, then
    # cancelled, 2026-11-03), so the Intel runner is the default; Xcode builds
    # the same universal Byte.app and arm64 iPhone app there.
    runs-on: ${{ inputs.mac_runner || 'macos-15-intel' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Version from pubspec
        shell: bash
        run: |
          echo "BYTE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          sw_vers
      - run: flutter pub get --enforce-lockfile
      - name: Build macOS
        run: |
          flutter build macos --release -v > build.log 2>&1 || { tail -c 9000 build.log; exit 1; }
      - name: Check, zip and dmg (macOS)
        run: |
          APP=build/macos/Build/Products/Release/Byte.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' $APP/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $APP/Contents/Info.plist | grep -qx "$BYTE_VERSION"
          file $APP/Contents/MacOS/Byte
          lipo -info $APP/Contents/MacOS/Byte
          lipo -info $APP/Contents/MacOS/Byte | grep -q arm64
          lipo -info $APP/Contents/MacOS/Byte | grep -q x86_64
          codesign -dv --entitlements - $APP 2>&1 | head -40 || true
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent $APP dist/Byte-v$BYTE_VERSION-macos.zip
          mkdir -p dmg && cp -R $APP dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Byte" -srcfolder dmg -ov -format UDZO dist/Byte-v$BYTE_VERSION-macos.dmg
          ls -la dist
      - name: Build iPhone (no code signing)
        run: |
          flutter build ios --release --no-codesign -v > build.log 2>&1 || { tail -c 9000 build.log; exit 1; }
      - name: Package .ipa
        run: |
          APP=build/ios/iphoneos/Runner.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $APP/Info.plist | grep -qx "$BYTE_VERSION"
          file $APP/Runner
          mkdir -p ipa/Payload && cp -R $APP ipa/Payload/
          (cd ipa && zip -qry ../dist/Byte-v$BYTE_VERSION-unsigned.ipa Payload)
          ls -la dist
      - name: Why the build failed
        if: failure()
        run: |
          touch build.log
          grep -iE 'error|fatal|failed' build.log | tail -n 40 > why.txt || true
          tail -n 60 build.log >> why.txt
          python3 - <<'EOF'
          t=open('why.txt',encoding='utf-8',errors='replace').read()[-7000:]
          for i in range(0,len(t),2300):
              print('::error title=build log %d::'%(i//2300)+t[i:i+2300].replace('%','%25').replace('\r','').replace('\n','%0A'))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Byte-apple
          path: dist/*
          if-no-files-found: error

  release:
    needs: [windows, linux, apple]
    # A platform left out on purpose (only: windows linux) doesn't stop it.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from pubspec
        shell: bash
        run: |
          echo "BYTE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Tag (and file names) for a fix release
        if: ${{ inputs.tag != '' }}
        shell: bash
        run: |
          T="${{ inputs.tag }}"
          cd dist
          for f in *v$BYTE_VERSION*; do mv "$f" "${f/v$BYTE_VERSION/$T}"; done
          echo "REL_TAG=$T" >> "$GITHUB_ENV"
          echo "REL_NAME=Byte ${T#v}" >> "$GITHUB_ENV"
      - run: ls -la dist && (cd dist && sha256sum * | tee SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.publish && (env.REL_TAG || format('v{0}', env.BYTE_VERSION)) || 'pipeline-test' }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.publish && (env.REL_NAME || format('Byte {0}', env.BYTE_VERSION)) || 'pipeline-test (not a release)' }}
          prerelease: ${{ !inputs.publish }}
          body: |
            Byte ${{ env.BYTE_VERSION }} for Windows, macOS, Linux and iPhone (unsigned).
            ${{ inputs.tag != '' && 'Fix release for the computer apps: sound on Windows is back (the Audio Lab filters silenced it); the player no longer redraws nonstop (smoother, cooler laptop); smooth mouse-wheel scrolling.' || '' }}
            Windows: run Byte-Setup, or unzip and open Byte.exe. If SmartScreen appears: More info → Run anyway.
            macOS: open the .dmg and drag Byte to Applications. First launch: right-click Byte → Open (or System Settings → Privacy & Security → Open Anyway).
            Linux: extract the .tar.gz and run ./byte (needs libmpv: sudo apt install libmpv2), or run the AppImage.
            © 2026 Apurba Laskar
          files: dist/*
          fail_on_unmatched_files: false
          make_latest: ${{ inputs.publish && 'true' || 'false' }}
      - name: Hand the files to Byte's build helper (encrypted)
        env:
          DIST_KEY: ${{ secrets.DIST_KEY }}
        run: bash .github/scripts/handoff.sh
