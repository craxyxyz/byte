# © 2026 Apurba Laskar
# Byte desktop builds: Windows (.zip + installer), macOS (.app zip + .dmg),
# Linux (.tar.gz + AppImage) and an unsigned iPhone .ipa, all from this repo.
# Every push to main builds them; a run on main also refreshes the GitHub Release.
name: Byte desktop builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.8
  BYTE_VERSION: 1.4.3

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - name: Check the exe
        shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Release/Byte.exe"
          if (!(Test-Path $exe)) { throw "Byte.exe missing" }
          $v = (Get-Item $exe).VersionInfo
          $v | Format-List ProductName, ProductVersion, FileVersion, CompanyName, LegalCopyright
          if ($v.ProductName -ne "Byte") { throw "ProductName is $($v.ProductName)" }
          Get-ChildItem build/windows/x64/runner/Release
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release dist/Byte
          Compress-Archive -Path dist/Byte -DestinationPath "dist/Byte-v$env:BYTE_VERSION-windows.zip"
          Remove-Item -Recurse dist/Byte
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/byte.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: Byte-windows
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev libsecret-1-dev libjsoncpp-dev libmpv2 file
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter build linux --release
      - name: Check and pack
        run: |
          B=build/linux/x64/release/bundle
          file $B/byte
          file $B/byte | grep -q ELF
          mkdir -p dist && cp -r $B dist/Byte
          tar -C dist -czf dist/Byte-v$BYTE_VERSION-linux-x64.tar.gz Byte
          rm -rf dist/Byte
          ls -la dist
      - name: AppImage
        continue-on-error: true
        run: |
          B=build/linux/x64/release/bundle
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          cp -r $B/* AppDir/usr/bin/
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps && cp linux/byte.png AppDir/usr/share/icons/hicolor/512x512/apps/byte.png
          export LD_LIBRARY_PATH=$PWD/AppDir/usr/bin/lib
          ARGS=""
          for so in AppDir/usr/bin/lib/*.so; do ARGS="$ARGS --library $so"; done
          MPV=$(ldconfig -p | grep -o '/[^ ]*libmpv.so.2' | head -1)
          [ -n "$MPV" ] && ARGS="$ARGS --library $MPV"
          APPIMAGE_EXTRACT_AND_RUN=1 OUTPUT=dist/Byte-v$BYTE_VERSION-x86_64.AppImage ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/byte --desktop-file linux/byte.desktop --icon-file linux/byte.png $ARGS --output appimage
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Byte-linux
          path: dist/*
          if-no-files-found: error

  apple:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build macOS
        run: flutter build macos --release
      - name: Check, zip and dmg (macOS)
        run: |
          APP=build/macos/Build/Products/Release/Byte.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' $APP/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $APP/Contents/Info.plist | grep -qx "$BYTE_VERSION"
          file $APP/Contents/MacOS/Byte
          lipo -info $APP/Contents/MacOS/Byte
          codesign -dv --entitlements - $APP 2>&1 | head -40 || true
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent $APP dist/Byte-v$BYTE_VERSION-macos.zip
          mkdir -p dmg && cp -R $APP dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Byte" -srcfolder dmg -ov -format UDZO dist/Byte-v$BYTE_VERSION-macos.dmg
          ls -la dist
      - name: Build iPhone (no code signing)
        run: flutter build ios --release --no-codesign
      - name: Package .ipa
        run: |
          APP=build/ios/iphoneos/Runner.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $APP/Info.plist | grep -qx "$BYTE_VERSION"
          file $APP/Runner
          mkdir -p ipa/Payload && cp -R $APP ipa/Payload/
          (cd ipa && zip -qry ../dist/Byte-v$BYTE_VERSION-unsigned.ipa Payload)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Byte-apple
          path: dist/*
          if-no-files-found: error

  release:
    needs: [windows, linux, apple]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist && (cd dist && sha256sum * | tee SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BYTE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Byte ${{ env.BYTE_VERSION }}
          body: |
            Byte ${{ env.BYTE_VERSION }} for Windows, macOS, Linux and iPhone (unsigned).
            Windows: run Byte-Setup, or unzip and open Byte.exe. If SmartScreen appears: More info → Run anyway.
            macOS: open the .dmg and drag Byte to Applications. First launch: right-click Byte → Open (or System Settings → Privacy & Security → Open Anyway).
            Linux: extract the .tar.gz and run ./byte (needs libmpv: sudo apt install libmpv2), or run the AppImage.
            © 2026 Apurba Laskar
          files: dist/*
          fail_on_unmatched_files: false
          make_latest: true
