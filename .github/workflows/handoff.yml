# Re-sends the files of an earlier build run to Byte's build helper (encrypted).
name: hand-off
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run id whose files to hand off
        required: true
permissions:
  actions: read
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: ls -la dist && (cd dist && sha256sum * | tee SHA256SUMS.txt)
      - name: Hand the files to Byte's build helper (encrypted)
        env:
          DIST_KEY: ${{ secrets.DIST_KEY }}
        run: bash .github/scripts/handoff.sh
