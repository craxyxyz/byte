name: probe audio on windows
on:
  push:
    branches: [v2-desktop]
    paths: ['.github/workflows/desktop-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audio devices
        shell: pwsh
        run: |
          $out = @()
          $out += (Get-Service Audiosrv, AudioEndpointBuilder | Format-Table Name, Status, StartType | Out-String)
          $out += (Get-CimInstance Win32_SoundDevice | Format-List Name, Status, StatusInfo | Out-String)
          $out += (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Format-List | Out-String)
          $out += (Get-Command ffmpeg -ErrorAction SilentlyContinue | Out-String)
          $out -join "`n" | Set-Content -Encoding utf8 probe.txt
          Get-Content probe.txt
      - name: Push report to ci-logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=$(base64 -w0 probe.txt)
          gh api -X PUT "repos/${{ github.repository }}/contents/ci/probe-${{ github.run_id }}.txt" -f message="probe ${{ github.run_id }}" -f content="$B" -f branch=ci-logs
